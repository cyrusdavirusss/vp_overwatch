<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 22px 24px; background: var(--ink-0); display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row-label {
      font-family: var(--font-mono);
      font-size: 9.5px; font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--fg-3);
      width: 80px;
    }
  </style>
</head>
<body>
  <div class="row"><div class="row-label">Status</div>
    <span class="chip chip-live"><span class="dot"></span>LIVE</span>
    <span class="chip chip-aircraft">AIRCRAFT</span>
    <span class="chip chip-threat">THREAT</span>
    <span class="chip chip-confirm">12× CONFIRMED</span>
    <span class="chip chip-stale">STALE</span>
  </div>
  <div class="row"><div class="row-label">Pulse</div>
    <span class="chip chip-live"><span class="dot dot-pulse"></span>LIVE 23s</span>
    <span class="chip chip-threat"><span class="dot dot-pulse" style="color: var(--red);"></span>ACTIVE</span>
  </div>
  <div class="row"><div class="row-label">Inline</div>
    <span style="font-family: var(--font-mono); font-size: 12px; color: var(--fg-2);">N911LA</span>
    <span style="color: var(--fg-4);">·</span>
    <span class="chip chip-aircraft">AS350</span>
    <span style="color: var(--fg-4);">·</span>
    <span class="num" style="font-size: 12px; color: var(--fg-1);">1,250ft</span>
    <span style="color: var(--green); font-size: 13px;">↑</span>
  </div>
</body>
</html>
