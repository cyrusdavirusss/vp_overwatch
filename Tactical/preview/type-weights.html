<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 16px 24px; background: var(--ink-0); display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
    .row:last-child { border-bottom: none; }
    .specimen {
      font-family: var(--font-ui);
      font-size: 24px;
      color: var(--fg-1);
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .weight-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="row"><span class="specimen" style="font-weight: 100;">Aktiv Grotesk</span><span class="weight-label">100 · Thin</span></div>
  <div class="row"><span class="specimen" style="font-weight: 200;">Aktiv Grotesk</span><span class="weight-label">200 · Hair</span></div>
  <div class="row"><span class="specimen" style="font-weight: 300;">Aktiv Grotesk</span><span class="weight-label">300 · Light</span></div>
  <div class="row"><span class="specimen" style="font-weight: 400;">Aktiv Grotesk</span><span class="weight-label">400 · Regular</span></div>
  <div class="row"><span class="specimen" style="font-weight: 500;">Aktiv Grotesk</span><span class="weight-label">500 · Medium</span></div>
  <div class="row"><span class="specimen" style="font-weight: 600;">Aktiv Grotesk</span><span class="weight-label">600 · SemiBold</span></div>
  <div class="row"><span class="specimen" style="font-weight: 700;">Aktiv Grotesk</span><span class="weight-label">700 · Bold</span></div>
  <div class="row"><span class="specimen" style="font-weight: 800;">Aktiv Grotesk</span><span class="weight-label">800 · XBold</span></div>
  <div class="row"><span class="specimen" style="font-weight: 900;">Aktiv Grotesk</span><span class="weight-label">900 · Black</span></div>
</body>
</html>
