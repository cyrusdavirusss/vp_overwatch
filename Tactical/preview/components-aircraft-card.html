<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 22px 24px; background: var(--ink-0); display: flex; flex-direction: column; gap: 14px; }
    .card-aircraft {
      background: var(--ink-1);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px 16px;
    }
    .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .callsign {
      font-family: var(--font-mono);
      font-size: 18px; font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--fg-1);
    }
    .meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-3);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      background: var(--border-subtle);
      border-radius: var(--r-sm);
      overflow: hidden;
    }
    .metric { background: var(--ink-2); padding: 8px 10px; }
    .metric-label {
      font-family: var(--font-mono);
      font-size: 9px; font-weight: 500;
      color: var(--fg-3);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .metric-val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 16px; font-weight: 600;
      color: var(--fg-1);
      line-height: 1;
    }
    .metric-unit { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-3); margin-top: 2px; }
    .trend-up { color: var(--green); }
  </style>
</head>
<body>
  <div class="card-aircraft">
    <div class="head">
      <span class="callsign">VH-PVH</span>
      <span class="meta">AW139 · VPAW Air Wing 6 · tracked 14m</span>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">alt</div><div class="metric-val">1,250 <span class="trend-up">↑</span></div><div class="metric-unit">ft</div></div>
      <div class="metric"><div class="metric-label">spd</div><div class="metric-val">78</div><div class="metric-unit">kts</div></div>
      <div class="metric"><div class="metric-label">hdg</div><div class="metric-val">085</div><div class="metric-unit">°</div></div>
      <div class="metric"><div class="metric-label">v/s</div><div class="metric-val trend-up">+180</div><div class="metric-unit">ft/m</div></div>
    </div>
  </div>
</body>
</html>
