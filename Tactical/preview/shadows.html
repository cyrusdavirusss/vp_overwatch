<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 32px 28px; background: var(--ink-0); display: flex; gap: 28px; align-items: center; justify-content: center; }
    .tile {
      width: 96px; height: 96px;
      background: var(--ink-2);
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
    }
    .tile-name {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      color: var(--fg-1);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .tile-val {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--fg-3);
      text-align: center;
      padding: 0 6px;
    }
  </style>
</head>
<body>
  <div class="tile" style="box-shadow: var(--shadow-sheet)"><div class="tile-name">sheet</div><div class="tile-val">0 −8 24 / .5</div></div>
  <div class="tile" style="box-shadow: var(--shadow-fab)"><div class="tile-name">fab</div><div class="tile-val">0 4 12 / .6</div></div>
  <div class="tile" style="box-shadow: var(--shadow-panel)"><div class="tile-name">panel</div><div class="tile-val">0 8 32 / .7</div></div>
  <div class="tile" style="box-shadow: var(--shadow-pop)"><div class="tile-name">pop</div><div class="tile-val">0 12 40 / .8</div></div>
</body>
</html>
