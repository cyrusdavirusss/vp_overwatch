<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 20px 24px; background: var(--ink-0); display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .tile {
      width: 78px; height: 78px;
      background: var(--ink-2);
      border: 1px solid var(--border);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
    }
    .tile-name {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      color: var(--fg-1);
      letter-spacing: 0.04em;
    }
    .tile-val {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--fg-3);
    }
  </style>
</head>
<body>
  <div class="tile" style="border-radius: var(--r-sm)"><div class="tile-name">r-sm</div><div class="tile-val">4px</div></div>
  <div class="tile" style="border-radius: var(--r-md)"><div class="tile-name">r-md</div><div class="tile-val">8px</div></div>
  <div class="tile" style="border-radius: var(--r-lg)"><div class="tile-name">r-lg</div><div class="tile-val">12px</div></div>
  <div class="tile" style="border-radius: var(--r-xl)"><div class="tile-name">r-xl</div><div class="tile-val">16px</div></div>
  <div class="tile" style="border-radius: var(--r-full)"><div class="tile-name">r-full</div><div class="tile-val">9999</div></div>
</body>
</html>
