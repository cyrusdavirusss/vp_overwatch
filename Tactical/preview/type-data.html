<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 18px 24px; background: var(--ink-0); }
    .row { display: flex; align-items: baseline; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); }
    .row:last-child { border-bottom: none; }
    .row-label {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--fg-3);
      min-width: 80px;
    }
    .row-spec {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--fg-4);
    }
  </style>
</head>
<body>
  <div class="row"><div class="row-label">Data XL</div><span class="t-data-xl">1,250</span><span class="row-spec">24 · tabular-nums</span></div>
  <div class="row"><div class="row-label">Data LG</div><span class="t-data-lg">78kts · 285°</span><span class="row-spec">18</span></div>
  <div class="row"><div class="row-label">Data</div><span class="t-data">+1,250 / −0,420 / 14:32:08</span><span class="row-spec">13</span></div>
  <div class="row"><div class="row-label">Ident</div><span class="t-ident">VH-PVH · AE5F8C</span><span class="row-spec">14 / 600 · 0.04em</span></div>
  <div class="row"><div class="row-label">Status</div><span class="chip chip-live"><span class="dot"></span>LIVE</span> <span class="chip chip-aircraft">AIRCRAFT</span> <span class="chip chip-threat">THREAT</span> <span class="chip chip-confirm">CONFIRMED</span></div>
</body>
</html>
