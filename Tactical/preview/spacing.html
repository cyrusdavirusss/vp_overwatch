<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 20px 24px; background: var(--ink-0); display: flex; gap: 20px; align-items: flex-end; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .col-tile {
      background: var(--blue-wash);
      border: 1px dashed var(--blue);
      border-radius: var(--r-sm);
    }
    .col-name {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.04em;
    }
    .col-val {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--fg-3);
    }
  </style>
</head>
<body>
  <div class="col"><div class="col-tile" style="width: 4px; height: 4px;"></div><div class="col-name">s-1</div><div class="col-val">4px</div></div>
  <div class="col"><div class="col-tile" style="width: 8px; height: 8px;"></div><div class="col-name">s-2</div><div class="col-val">8px</div></div>
  <div class="col"><div class="col-tile" style="width: 12px; height: 12px;"></div><div class="col-name">s-3</div><div class="col-val">12px</div></div>
  <div class="col"><div class="col-tile" style="width: 16px; height: 16px;"></div><div class="col-name">s-4</div><div class="col-val">16px</div></div>
  <div class="col"><div class="col-tile" style="width: 20px; height: 20px;"></div><div class="col-name">s-5</div><div class="col-val">20px</div></div>
  <div class="col"><div class="col-tile" style="width: 24px; height: 24px;"></div><div class="col-name">s-6</div><div class="col-val">24px</div></div>
  <div class="col"><div class="col-tile" style="width: 32px; height: 32px;"></div><div class="col-name">s-8</div><div class="col-val">32px</div></div>
  <div class="col"><div class="col-tile" style="width: 40px; height: 40px;"></div><div class="col-name">s-10</div><div class="col-val">40px</div></div>
  <div class="col"><div class="col-tile" style="width: 64px; height: 64px;"></div><div class="col-name">s-16</div><div class="col-val">64px</div></div>
</body>
</html>
