<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 18px 22px; background: var(--ink-0); display: flex; gap: 28px; align-items: center; }
    .item { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
    .label {
      font-family: var(--font-mono);
      font-size: 9px; font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg-3);
    }
    .holder {
      padding: 14px 16px;
      background: var(--ink-1);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="item">
    <div class="holder"><img src="../assets/logo/mark.svg" width="64" height="64" alt="Mark" /></div>
    <div class="label">Mark · 64px</div>
  </div>
  <div class="item" style="flex: 1;">
    <div class="holder" style="width: 100%; padding: 14px 20px;"><img src="../assets/logo/wordmark.svg" height="40" alt="Wordmark" /></div>
    <div class="label">Wordmark · stencil milspec</div>
  </div>
</body>
</html>
