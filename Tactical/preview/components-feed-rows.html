<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 22px 24px; background: var(--ink-0); display: flex; flex-direction: column; gap: 12px; }
    .feed-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .feed-icon {
      width: 36px; height: 36px;
      background: var(--ink-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
    }
    .feed-icon.amber { background: var(--amber-wash); border-color: color-mix(in srgb, var(--amber) 30%, var(--border)); color: var(--amber); }
    .feed-icon.red   { background: var(--red-wash);   border-color: color-mix(in srgb, var(--red) 30%, var(--border));   color: var(--red); }
    .feed-body { flex: 1; min-width: 0; }
    .l1 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
    .ident { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--fg-1); letter-spacing: 0.04em; }
    .type { font-size: 11px; color: var(--fg-3); }
    .l2 { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--fg-2); }
    .sep { color: var(--fg-4); }
    .trend-up { color: var(--green); }
    .meta { text-align: right; }
    .dist { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--fg-1); }
    .bearing { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-3); letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="feed-item">
    <div class="feed-icon amber">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8 H19 M12 8 V14 M9 14 H15 M7 17 H17 M11 14 V17 M13 14 V17 M12 5 V8"/></svg>
    </div>
    <div class="feed-body">
      <div class="l1"><span class="ident">VH-PVH</span><span class="type">AW139 · VPAW</span></div>
      <div class="l2">1,250ft <span class="trend-up">↑</span> <span class="sep">·</span> 78kts <span class="sep">·</span> 085°</div>
    </div>
    <div class="meta"><div class="dist">3.2nm</div><div class="bearing">NE</div></div>
  </div>
  <div class="feed-item">
    <div class="feed-icon red">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12 S5 5 12 5 S22 12 22 12 S19 19 12 19 S2 12 2 12 Z M15 12 A3 3 0 1 1 12 9 A3 3 0 0 1 15 12"/></svg>
    </div>
    <div class="feed-body">
      <div class="l1"><span class="ident" style="font-family: var(--font-ui); letter-spacing: 0;">Hidden unit</span><span class="chip chip-confirm" style="font-size: 9px;">12× CONFIRMED</span></div>
      <div class="l2" style="font-family: var(--font-ui); letter-spacing: 0;">Hidden unit, Princes Hwy EB</div>
    </div>
    <div class="meta"><div class="dist">1.4mi</div><div class="bearing">SW · 47s</div></div>
  </div>
</body>
</html>
