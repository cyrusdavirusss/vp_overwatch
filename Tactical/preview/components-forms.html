<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 22px 24px; background: var(--ink-0); display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row-label { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; color: var(--fg-3); width: 76px; }
    .switch { width: 36px; height: 20px; border-radius: var(--r-full); background: var(--ink-3); position: relative; }
    .switch.on { background: var(--blue); }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: left 0.18s; }
    .switch.on::after { left: 18px; }
    .chip-tg {
      display: inline-flex; align-items: center; gap: 5px;
      height: 28px; padding: 0 11px;
      border-radius: var(--r-full);
      background: var(--ink-2);
      border: 1px solid var(--border);
      color: var(--fg-2);
      font-family: var(--font-ui);
      font-size: 11.5px; font-weight: 500;
    }
    .chip-tg.on { background: var(--blue-wash); border-color: var(--blue); color: var(--blue); }
    .slider {
      position: relative;
      width: 200px; height: 4px;
      background: var(--ink-3);
      border-radius: var(--r-full);
    }
    .slider-fill {
      position: absolute; top: 0; left: 0;
      width: 55%; height: 100%;
      background: var(--blue);
      border-radius: var(--r-full);
    }
    .slider-thumb {
      position: absolute; left: 55%; top: 50%;
      transform: translate(-50%, -50%);
      width: 16px; height: 16px;
      background: var(--blue);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .slider-val {
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: 12px; font-weight: 600; color: var(--fg-1);
    }
  </style>
</head>
<body>
  <div class="row"><div class="row-label">Switch</div>
    <div class="switch on"></div>
    <div class="switch"></div>
  </div>
  <div class="row"><div class="row-label">Chip toggle</div>
    <button class="chip-tg on">Rotary</button>
    <button class="chip-tg">Fixed-wing</button>
    <button class="chip-tg on">Marked</button>
    <button class="chip-tg">Unmarked</button>
  </div>
  <div class="row"><div class="row-label">Slider</div>
    <div class="slider"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
    <span class="slider-val">8nm</span>
  </div>
</body>
</html>
