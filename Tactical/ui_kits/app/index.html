<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VP-Overwatch · Mobile App</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #050608;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
      box-sizing: border-box;
    }
    .stage-inner {
      transform-origin: center center;
    }
    .device {
      width: 393px;
      height: 852px;
      border-radius: 52px;
      overflow: hidden;
      position: relative;
      background: #000;
      box-shadow:
        0 0 0 10px #0F1115,
        0 0 0 11px rgba(255,255,255,0.04),
        0 50px 100px rgba(0,0,0,0.65),
        0 0 90px rgba(77,124,255,0.08);
    }
    /* Dynamic island */
    .device::before {
      content: '';
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      width: 122px; height: 36px;
      background: #000;
      border-radius: 22px;
      z-index: 100;
      pointer-events: none;
    }
    /* Home indicator */
    .device::after {
      content: '';
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: rgba(255,255,255,0.55);
      border-radius: 3px;
      z-index: 100;
      pointer-events: none;
    }
    /* Boot splash — shown until React mounts */
    .boot-splash {
      position: absolute;
      inset: 0;
      background: #0A0B0D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 50;
      transition: opacity 220ms ease-out;
    }
    .boot-splash.hide { opacity: 0; pointer-events: none; }
    .boot-id {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #F2F4F8;
    }
    .boot-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #6B7280;
    }
    .boot-dot {
      width: 6px; height: 6px;
      background: #4D7CFF;
      border-radius: 50%;
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.25); }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="Icon.jsx"></script>
  <script type="text/babel" src="Map.jsx"></script>
  <script type="text/babel" src="StatusStrip.jsx"></script>
  <script type="text/babel" src="Scrubber.jsx"></script>
  <script type="text/babel" src="BottomSheet.jsx"></script>
  <script type="text/babel" src="AircraftDetail.jsx"></script>
  <script type="text/babel" src="ReportDetail.jsx"></script>
  <script type="text/babel" src="FilterPanel.jsx"></script>
  <script type="text/babel" src="Fab.jsx"></script>
  <script type="text/babel" src="Onboarding.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</head>
<body>
  <div class="stage" data-screen-label="01 Main Map">
    <div class="stage-inner">
      <div class="device" id="device">
        <div id="boot-splash" class="boot-splash">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <path d="M 18 4 L 46 4 L 60 18 L 60 46 L 46 60 L 18 60 L 4 46 L 4 18 Z"
                  fill="none" stroke="#4D7CFF" stroke-width="1" opacity="0.6"/>
            <circle cx="32" cy="32" r="14" stroke="#4D7CFF" stroke-width="1" fill="none" opacity="0.7"/>
            <path d="M 32 6 L 32 11 M 32 53 L 32 58 M 6 32 L 11 32 M 53 32 L 58 32"
                  stroke="#4D7CFF" stroke-width="1.4" stroke-linecap="square"/>
            <path d="M 32 24 L 38 39 L 32 36 L 26 39 Z" fill="#FFB020"/>
          </svg>
          <div class="boot-id">VP-OVERWATCH</div>
          <div class="boot-sub"><span class="boot-dot"></span>INITIALIZING</div>
        </div>
        <div id="root" style="width: 100%; height: 100%;"></div>
      </div>
    </div>
  </div>

  <script type="text/babel" data-presets="env,react">
    function mountWhenReady() {
      if (!window.VPApp) { setTimeout(mountWhenReady, 50); return; }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<VPApp />);

      // Hide boot splash after a moment
      setTimeout(() => {
        const splash = document.getElementById('boot-splash');
        if (splash) splash.classList.add('hide');
        setTimeout(() => splash && splash.remove(), 300);
      }, 600);

      // Scale the device to fit viewport
      const scale = () => {
        const inner = document.querySelector('.stage-inner');
        if (!inner) return;
        const vh = window.innerHeight - 48;
        const vw = window.innerWidth - 48;
        if (vw <= 0 || vh <= 0) return;
        const FRAME_W = 413, FRAME_H = 872;
        const s = Math.max(0.3, Math.min(vw / FRAME_W, vh / FRAME_H, 1.4));
        inner.style.transform = `scale(${s})`;
      };
      // Two-pass scale: once now, once after layout settles
      scale();
      requestAnimationFrame(scale);
      setTimeout(scale, 100);
      window.addEventListener('resize', scale);
    }
    mountWhenReady();
  </script>
</body>
</html>
