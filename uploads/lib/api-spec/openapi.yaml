openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Victoria Police Helicopter Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: helicopters
    description: Helicopter tracking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /helicopters/active:
    get:
      operationId: listActiveHelicopters
      tags: [helicopters]
      summary: List active helicopters
      description: Returns all helicopters currently airborne with live tracking data
      responses:
        "200":
          description: List of active helicopters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveHelicopter"

  /helicopters/history:
    get:
      operationId: listFlightHistory
      tags: [helicopters]
      summary: List flight history
      description: Returns historical flight records
      responses:
        "200":
          description: Flight history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightRecord"

  /helicopters/stats:
    get:
      operationId: getHelicopterStats
      tags: [helicopters]
      summary: Get statistics
      description: Returns aggregate stats about flight history
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelicopterStats"

  /helicopters/breadcrumbs/{hex}:
    get:
      operationId: getFlightBreadcrumbs
      tags: [helicopters]
      summary: Get position breadcrumb trail
      description: Returns ordered position history for the current active flight of a given aircraft hex
      parameters:
        - name: hex
          in: path
          required: true
          schema:
            type: string
          description: ICAO hex code of the aircraft
      responses:
        "200":
          description: Breadcrumb trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PositionBreadcrumb"

  /helicopters/poll:
    post:
      operationId: triggerPoll
      tags: [helicopters]
      summary: Trigger a manual ADS-B poll
      description: Manually triggers a poll of ADS-B Exchange for the target helicopter
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ActiveHelicopter:
      type: object
      required:
        - hex
        - registration
        - callsign
        - startTime
        - timeAirborneSeconds
        - estimatedReturnSeconds
        - historicalAverageSeconds
        - latitude
        - longitude
        - altitude
        - speed
        - track
      properties:
        hex:
          type: string
          description: ICAO hex code
        registration:
          type: string
          description: Aircraft registration
        callsign:
          type: ["string", "null"]
          description: Current callsign
        startTime:
          type: string
          format: date-time
          description: When the flight started (first seen airborne)
        timeAirborneSeconds:
          type: integer
          description: Seconds since takeoff
        estimatedReturnSeconds:
          type: integer
          description: Estimated seconds until landing based on historical average
        historicalAverageSeconds:
          type: integer
          description: Historical average flight duration in seconds
        latitude:
          type: ["number", "null"]
          description: Current latitude
        longitude:
          type: ["number", "null"]
          description: Current longitude
        altitude:
          type: ["integer", "null"]
          description: Current altitude in feet
        speed:
          type: ["number", "null"]
          description: Current ground speed in knots
        track:
          type: ["number", "null"]
          description: Current track in degrees

    FlightRecord:
      type: object
      required:
        - id
        - hex
        - registration
        - startTime
        - endTime
        - durationSeconds
      properties:
        id:
          type: integer
        hex:
          type: string
        registration:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationSeconds:
          type: integer
        maxAltitude:
          type: ["integer", "null"]
        maxSpeed:
          type: ["number", "null"]

    HelicopterStats:
      type: object
      required:
        - totalFlights
        - averageDurationSeconds
        - longestFlightSeconds
        - shortestFlightSeconds
        - totalHoursAirborne
        - flightsLast7Days
        - flightsLast30Days
      properties:
        totalFlights:
          type: integer
        averageDurationSeconds:
          type: integer
        longestFlightSeconds:
          type: integer
        shortestFlightSeconds:
          type: integer
        totalHoursAirborne:
          type: number
        flightsLast7Days:
          type: integer
        flightsLast30Days:
          type: integer

    PositionBreadcrumb:
      type: object
      required:
        - id
        - hex
        - registration
        - latitude
        - longitude
        - recordedAt
      properties:
        id:
          type: integer
        hex:
          type: string
        registration:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: ["integer", "null"]
        speed:
          type: ["number", "null"]
        track:
          type: ["number", "null"]
        recordedAt:
          type: string
          format: date-time

    PollResult:
      type: object
      required:
        - polledAt
        - isAirborne
        - message
      properties:
        polledAt:
          type: string
          format: date-time
        isAirborne:
          type: boolean
        message:
          type: string
        data:
          type: object
          description: Raw ADS-B data if available
