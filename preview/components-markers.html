<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 20px 14px; background: var(--ink-0); display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 6px; }
    .marker-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 4px 2px;
    }
    .timestamp {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 9px;
      color: var(--fg-3);
      letter-spacing: 0.06em;
    }
    .timestamp .live { color: var(--blue); }
    .marker {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .label {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      color: var(--fg-1);
      letter-spacing: 0.04em;
    }
    .sublabel {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--fg-4);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="marker-wrap">
    <div class="timestamp"><span class="live">●</span> 00:23</div>
    <div class="marker"><img src="../assets/markers/rotary.svg" width="32" height="32" /></div>
    <div class="label">Rotary</div>
    <div class="sublabel">aircraft</div>
  </div>
  <div class="marker-wrap">
    <div class="timestamp"><span class="live">●</span> 00:18</div>
    <div class="marker"><img src="../assets/markers/fixedwing.svg" width="32" height="32" /></div>
    <div class="label">Fixed-wing</div>
    <div class="sublabel">aircraft</div>
  </div>
  <div class="marker-wrap">
    <div class="timestamp">−00:47</div>
    <div class="marker"><img src="../assets/markers/marked.svg" width="36" height="36" /></div>
    <div class="label">Marked</div>
    <div class="sublabel">ground</div>
  </div>
  <div class="marker-wrap">
    <div class="timestamp">−01:28</div>
    <div class="marker"><img src="../assets/markers/unmarked.svg" width="36" height="36" /></div>
    <div class="label">Unmarked</div>
    <div class="sublabel">ground</div>
  </div>
  <div class="marker-wrap">
    <div class="timestamp">−02:14</div>
    <div class="marker"><img src="../assets/markers/hidden.svg" width="36" height="36" /></div>
    <div class="label">Hidden</div>
    <div class="sublabel">ground</div>
  </div>
  <div class="marker-wrap">
    <div class="timestamp">−00:36</div>
    <div class="marker"><img src="../assets/markers/stop.svg" width="36" height="36" /></div>
    <div class="label">Stop</div>
    <div class="sublabel">roadside</div>
  </div>
  <div class="marker-wrap">
    <div class="timestamp">−05:42</div>
    <div class="marker"><img src="../assets/markers/checkpoint.svg" width="36" height="36" /></div>
    <div class="label">Checkpoint</div>
    <div class="sublabel">ground</div>
  </div>
  <div class="marker-wrap">
    <div class="timestamp">−01:55</div>
    <div class="marker"><img src="../assets/markers/rbt.svg" width="36" height="36" /></div>
    <div class="label">RBT</div>
    <div class="sublabel">breath test</div>
  </div>
  <div class="marker-wrap">
    <div class="timestamp">−12:08</div>
    <div class="marker"><img src="../assets/markers/camera.svg" width="36" height="36" /></div>
    <div class="label">Camera</div>
    <div class="sublabel">speed/red</div>
  </div>
</body>
</html>
