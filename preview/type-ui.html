<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 20px 24px; background: var(--ink-0); font-family: var(--font-ui); }
    .row { display: flex; align-items: baseline; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
    .row:last-child { border-bottom: none; }
    .row-label {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--fg-3);
      width: 80px;
      flex-shrink: 0;
    }
    .row-spec {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-4);
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="row"><div class="row-label">Display</div><span class="t-display">Aktiv Grotesk</span><span class="row-spec">32 / 600 SemiBold · −0.012em</span></div>
  <div class="row"><div class="row-label">Title</div><span class="t-title">VH-PVH · AW139</span><span class="row-spec">24 / 600</span></div>
  <div class="row"><div class="row-label">Heading</div><span class="t-heading">Active Aircraft</span><span class="row-spec">18 / 600</span></div>
  <div class="row"><div class="row-label">Body</div><span class="t-body">Hidden unit reported 8m ago, 4 confirmations</span><span class="row-spec">14 / 400</span></div>
  <div class="row"><div class="row-label">Body sm</div><span class="t-body-sm">tracked 14m · 3.2nm NE</span><span class="row-spec">13 / 400</span></div>
  <div class="row"><div class="row-label">Label</div><span class="t-label">Layers &amp; Filters</span><span class="row-spec">11 / 500 · uppercase</span></div>
  <div class="row"><div class="row-label">Caption</div><span class="t-caption">Last update 14:32:08</span><span class="row-spec">12 / 400</span></div>
</body>
</html>
