<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 18px 20px; background: var(--ink-0); font-family: var(--font-ui); }
    .row { display: flex; gap: 12px; margin-bottom: 12px; }
    .accent {
      flex: 1;
      border-radius: var(--r-md);
      background: var(--ink-1);
      border: 1px solid var(--border);
      padding: 14px;
    }
    .accent-chip {
      height: 48px;
      border-radius: var(--r-sm);
      margin-bottom: 10px;
    }
    .accent-name {
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-1);
      margin-bottom: 2px;
    }
    .accent-hex {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-3);
      margin-bottom: 6px;
    }
    .accent-use {
      font-size: 11px;
      color: var(--fg-2);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="accent">
      <div class="accent-chip" style="background: #4D7CFF"></div>
      <div class="accent-name">Signal Blue</div>
      <div class="accent-hex">#4D7CFF</div>
      <div class="accent-use">UI chrome, interactive, the “now” indicator, user position</div>
    </div>
    <div class="accent">
      <div class="accent-chip" style="background: #FFB020"></div>
      <div class="accent-name">Aviation Amber</div>
      <div class="accent-hex">#FFB020</div>
      <div class="accent-use">Active aircraft only. Reserved. The eye should track aircraft activity without reading.</div>
    </div>
    <div class="accent">
      <div class="accent-chip" style="background: #FF4757"></div>
      <div class="accent-name">Threat Red</div>
      <div class="accent-hex">#FF4757</div>
      <div class="accent-use">Confirmed ground threats. Used sparingly; reserved for severity.</div>
    </div>
  </div>
</body>
</html>
