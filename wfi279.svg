<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270">
  <!-- Glossy black plate background -->
  <rect x="15" y="15" width="970" height="240" rx="8" ry="8" fill="#111112"/>
  
  <!-- Thin outer frame -->
  <rect x="15" y="15" width="970" height="240" rx="8" ry="8" fill="none" stroke="#E0E0E0" stroke-width="2.5"/>
  
  <!-- Inner raised rim -->
  <rect x="20" y="20" width="960" height="230" rx="6" ry="6" fill="none" stroke="#C8C8C8" stroke-width="1.5"/>
  
  <!-- VIC stacked vertically on the left - slanted -->
  <text x="40" y="175" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" fill="#E0E0E0" transform="rotate(-4, 40, 175)">V</text>
  <text x="40" y="200" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" fill="#E0E0E0" transform="rotate(-4, 40, 200)">I</text>
  <text x="40" y="225" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" fill="#E0E0E0" transform="rotate(-4, 40, 225)">C</text>
  
  <!-- WFI text -->
  <text x="110" y="185" font-family="Arial Black, Impact, Arial, Helvetica, sans-serif" font-weight="900" font-size="120" fill="#E8E8E8" letter-spacing="8">WFI</text>
  
  <!-- Diamond separator -->
  <polygon points="515,120 525,105 535,120 525,135" fill="#E8E8E8"/>
  
  <!-- 279 text -->
  <text x="565" y="185" font-family="Arial Black, Impact, Arial, Helvetica, sans-serif" font-weight="900" font-size="120" fill="#E8E8E8" letter-spacing="6">279</text>
  
  <!-- Screw recesses (white circles) top-left -->
  <circle cx="40" cy="40" r="5" fill="#D0D0D0" opacity="0.8"/>
  <circle cx="120" cy="40" r="5" fill="#D0D0D0" opacity="0.8"/>
  
  <!-- Screw recesses top-right -->
  <circle cx="870" cy="40" r="5" fill="#D0D0D0" opacity="0.8"/>
  <circle cx="955" cy="40" r="5" fill="#D0D0D0" opacity="0.8"/>
  
  <!-- Subtle emboss effect - text shadows -->
  <text x="110" y="188" font-family="Arial Black, Impact, Arial, Helvetica, sans-serif" font-weight="900" font-size="120" fill="#000000" opacity="0.4" letter-spacing="8" transform="translate(1,2)">WFI</text>
  <text x="565" y="188" font-family="Arial Black, Impact, Arial, Helvetica, sans-serif" font-weight="900" font-size="120" fill="#000000" opacity="0.4" letter-spacing="6" transform="translate(1,2)">279</text>
</svg>
